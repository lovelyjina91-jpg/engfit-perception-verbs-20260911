<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지각동사 | 영핏영어</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--bg:#F4F6F8;--ink:#0F172A;--sub:#475569;--line:#CBD5E1;--green:#157A3A;--gold:#B45309;--navy:#1B2970;--red:#B91C1C}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg)}
body{font-family:'Pretendard','Pretendard Variable','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;user-select:none}
body.nocursor{cursor:none}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:0 0;background:var(--bg);overflow:hidden}
.slide{position:absolute;inset:0;padding:150px 120px 110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px;opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s linear .45s}
.slide.active{opacity:1;visibility:visible;transition:opacity .45s ease}
.hd{position:absolute;top:44px;left:120px;right:120px;display:flex;justify-content:space-between;align-items:center}
.sec{font-size:32px;font-weight:800;color:#fff;background:var(--navy);padding:10px 28px;border-radius:999px}
.logo{display:flex;align-items:baseline;gap:12px}
.logo b{font-size:32px;font-weight:900;color:var(--navy);letter-spacing:-.5px}
.logo span{font-size:18px;font-weight:700;color:var(--sub);letter-spacing:3px}
#bar{position:absolute;left:0;bottom:0;height:10px;width:100%;background:#E2E8F0}
#bar i{display:block;height:100%;width:0;background:var(--navy);transition:width .45s ease}
#cnt{position:absolute;right:40px;bottom:24px;font-size:22px;font-weight:700;color:#94A3B8}
#hint{position:absolute;right:40px;bottom:60px;font-size:26px;font-weight:700;background:#fff;color:var(--navy);border:3px solid var(--navy);padding:12px 24px;border-radius:999px;transition:opacity .6s}
#hint.hide{opacity:0}

/* reveal */
.fx{opacity:0;transform:translateY(18px);transition:opacity .45s ease,transform .45s ease}
.fx.on{opacity:1;transform:none}
.delay.on{transition-delay:2.2s}
.delay-out:not(.on){transition-delay:2.2s}
.stack{display:grid;justify-items:center;align-items:center}
.stack>*{grid-area:1/1}

/* roles */
.r-s{--c:#1D4ED8;--t:#DBEAFE}
.r-v{--c:#157A3A;--t:#DCFCE7}
.r-o{--c:#B45309;--t:#FEF3C7}
.r-b{--c:#6D28D9;--t:#EDE9FE}
.r-ing{--c:#BE185D;--t:#FCE7F3}
.r-pp{--c:#0F766E;--t:#CCFBF1}
.r-x{--c:#334155;--t:#E2E8F0}

.chunks{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:26px 24px;transition:filter .5s}
.chunk{display:inline-flex;flex-direction:column;align-items:center;gap:10px}
.chunk .lab{font-size:30px;font-weight:800;color:var(--c)}
.chunk .w{font-size:var(--cw,76px);font-weight:800;color:var(--c);background:var(--t);border:4px solid var(--c);border-radius:22px;padding:4px 30px 10px;line-height:1.15;white-space:nowrap;transition:box-shadow .4s,transform .4s}
.chunk.cur .w{box-shadow:0 0 0 10px color-mix(in srgb,var(--c) 22%,transparent);transform:scale(1.05)}
.chunks .dot{font-size:var(--cw,76px);font-weight:800;color:var(--ink);align-self:flex-end;padding-bottom:10px;margin-left:-14px}
.done-badge{font-size:40px;font-weight:800;color:var(--green)}

.kr{font-size:60px;font-weight:700;line-height:1.35;text-align:center}
.kr .note{font-size:40px;color:var(--sub);font-weight:600;margin-left:14px}
.kp{padding:0 8px;border-radius:12px;transition:color .4s,background .4s,box-shadow .4s}
.kp.lit{color:var(--c);background:var(--t);box-shadow:inset 0 -6px 0 var(--c)}
.prompt{font-size:34px;font-weight:700;color:var(--sub)}

.tip{font-size:42px;font-weight:600;background:#fff;border:3px solid var(--line);border-radius:26px;padding:22px 44px;box-shadow:0 10px 30px rgba(15,23,42,.07);text-align:center;line-height:1.4;position:relative}
.tip b{color:var(--navy);font-weight:800}
.tip em{font-style:normal;font-weight:800;color:var(--green)}
.tip .no{color:var(--red);font-weight:800}
.tip.final{border-color:var(--green);background:#F0FDF4}

.ck{color:var(--c);background:var(--t);border-radius:14px;padding:0 14px 4px;margin:0 3px;font-weight:800;-webkit-box-decoration-break:clone;box-decoration-break:clone}

/* title */
.t-kick{font-size:40px;font-weight:700;color:var(--sub);letter-spacing:2px}
.t-main{font-size:210px;font-weight:900;color:var(--navy);letter-spacing:-6px;line-height:1}
.t-sub{font-size:64px;font-weight:700}
.t-emo{font-size:110px;letter-spacing:30px}

/* concept */
.headline{font-size:78px;font-weight:800;text-align:center;line-height:1.25}
.headline b{color:var(--green)}
.subline{font-size:48px;font-weight:600;color:var(--sub);text-align:center}
.subline b{color:var(--gold);font-weight:800}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:28px;width:100%}
.card{background:#fff;border:3px solid var(--line);border-radius:30px;padding:34px 16px;display:flex;flex-direction:column;align-items:center;gap:14px}
.card .e{font-size:92px;line-height:1}
.card .en{font-size:50px;font-weight:800;color:var(--green);text-align:center;line-height:1.15}
.card .ko{font-size:40px;font-weight:700;color:var(--sub)}

/* merge */
.t-merge{gap:32px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:30px;width:100%;margin-top:10px}
.mcard{background:#fff;border:3px solid var(--line);border-radius:28px;padding:20px 24px;display:flex;flex-direction:column;align-items:center;gap:10px}
.mcard .k{font-size:46px;font-weight:700;color:var(--sub)}
.mcard .e{font-size:50px;font-weight:800;white-space:nowrap}
.hl{padding:0 8px;border-radius:10px;transition:background .4s,color .4s}
.hl.lit{color:var(--c);background:var(--t)}
.arrow{font-size:52px;font-weight:800;color:var(--navy)}
.result{background:#fff;border:4px solid var(--navy);border-radius:32px;padding:30px 50px;display:flex;flex-direction:column;align-items:center;gap:18px}
.result .k{font-size:54px;font-weight:700}
.result .e{font-size:64px;font-weight:800}

/* skeleton */
.fgrid{display:grid;grid-template-columns:repeat(7,auto);justify-content:center;align-items:center;column-gap:22px;row-gap:46px}
.fbox{position:relative;min-width:310px;background:var(--t);border:5px solid var(--c);border-radius:28px;padding:24px 20px;display:flex;flex-direction:column;align-items:center;gap:8px}
.fbox .n{font-size:66px;font-weight:900;color:var(--c)}
.fbox .h{font-size:32px;font-weight:700;color:var(--ink)}
.plus{font-size:64px;font-weight:800;color:#94A3B8}
.stamp{position:absolute;top:-38px;right:-30px;background:var(--red);color:#fff;font-size:40px;font-weight:900;padding:8px 22px;border-radius:18px;transform:rotate(8deg);box-shadow:0 8px 20px rgba(185,28,28,.3)}
.stamp.fx{transform:rotate(8deg) translateY(18px)}
.stamp.fx.on{transform:rotate(8deg)}
.fex{justify-self:center}
.fex .w{font-size:66px}

/* trap */
.trows{display:flex;flex-direction:column;gap:40px;width:100%}
.trow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:26px}
.tc{border-radius:26px;padding:24px 30px;font-size:56px;font-weight:800;text-align:center;border:4px solid}
.tc.bad{background:#FEF2F2;border-color:#FCA5A5;color:#7F1D1D}
.tc.good{background:#F0FDF4;border-color:var(--green);color:#14532D}
.tc .x{color:var(--red);text-decoration:line-through;text-decoration-thickness:6px}
.tc .ok{color:var(--green);text-decoration:underline;text-decoration-thickness:6px;text-underline-offset:10px}
.tarrow{font-size:60px;color:#94A3B8;font-weight:800}
.twhy{grid-column:1/-1;font-size:38px;font-weight:700;color:var(--sub);text-align:center;margin-top:-12px}
.twhy b{color:var(--red)}
.memo{background:#FFF7ED;border:5px solid var(--gold);border-radius:30px;padding:26px 56px;font-size:60px;font-weight:900;text-align:center;line-height:1.3}
.memo b{color:var(--gold)}
.memo .small{display:block;font-size:36px;font-weight:700;color:var(--sub);margin-top:6px}

/* blank */
.bsent{font-size:76px;font-weight:800;display:flex;align-items:center;gap:26px;flex-wrap:wrap;justify-content:center}
.blank{display:inline-grid;min-width:300px;border-bottom:8px dashed var(--navy);padding:0 20px;justify-items:center}
.blank>*{grid-area:1/1}
.blank .q{color:#94A3B8}
.blank .a{color:#6D28D9}
.opts{display:flex;gap:30px}
.opt{font-size:54px;font-weight:800;background:#fff;border:4px solid var(--line);border-radius:22px;padding:14px 40px;transition:all .45s ease}
.opt i{font-style:normal;color:var(--sub);margin-right:14px;font-size:44px}
.opt.good.lit{background:#DCFCE7;border-color:var(--green);color:var(--green);transform:scale(1.08)}
.opt.bad.lit{opacity:.35;text-decoration:line-through}
.opt.delay.lit{transition-delay:2.2s}
.think{display:flex;align-items:center;gap:24px;font-size:40px;font-weight:700;color:var(--navy)}
.think .track{width:520px;height:16px;border-radius:99px;background:#E2E8F0;overflow:hidden}
.think .fill{height:100%;width:0;background:var(--navy);border-radius:99px;transition:width 0s}
.think.on .fill{width:100%;transition:width 2.2s linear}

/* compare */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:40px;width:100%}
.cc{background:#fff;border:4px solid var(--c);border-radius:32px;padding:34px 36px;display:flex;flex-direction:column;align-items:center;gap:22px}
.cc .s{font-size:46px;font-weight:800}
.cc .tag{font-size:40px;font-weight:900;color:var(--c);background:var(--t);padding:6px 26px;border-radius:999px}
.cc .d{font-size:42px;font-weight:700;text-align:center}
.track2{position:relative;width:640px;height:150px}
.track2 .line{position:absolute;left:30px;right:30px;top:100px;height:14px;background:#E2E8F0;border-radius:99px;overflow:hidden}
.track2 .fill{height:100%;width:0;background:var(--c);transition:width 1.8s ease-in-out}
.track2.lit .fill{width:100%}
.track2 .walker{position:absolute;top:18px;left:0;font-size:70px;transition:left 1.8s ease-in-out}
.track2.lit .walker{left:560px}
.track2 .lb{position:absolute;top:122px;font-size:28px;font-weight:700;color:var(--sub)}
.track2 .frame{position:absolute;left:220px;top:0;width:200px;height:140px;border:6px solid var(--c);border-radius:18px;opacity:0;transition:opacity .5s}
.track2.lit .frame{opacity:1}
.track2 .walker.mid{left:285px}
.cnote{font-size:44px;font-weight:700;text-align:center;line-height:1.4}
.cnote b{color:var(--green)}

/* pair */
.prows{display:flex;flex-direction:column;gap:46px;width:100%;align-items:center}
.prow{display:flex;flex-direction:column;align-items:center;gap:14px}
.prow .k{font-size:50px;font-weight:700}
.prow .e{font-size:66px;font-weight:800}
.prow .why{font-size:38px;font-weight:700;color:var(--sub)}
.prow .why b{color:var(--c)}
.rule{display:grid;grid-template-columns:auto auto;gap:14px 30px;background:#fff;border:4px solid var(--navy);border-radius:28px;padding:26px 46px;font-size:44px;font-weight:700}
.rule .ck{font-size:44px}

/* drill */
.dwrap{width:100%;height:560px}
.ditem{display:flex;flex-direction:column;align-items:center;gap:50px;width:100%}
.dnum{font-size:32px;font-weight:800;color:var(--navy);background:#E0E7FF;padding:6px 24px;border-radius:999px}
.dkr{font-size:66px;font-weight:700;text-align:center;line-height:1.3}
.dkr .note{display:block;font-size:40px;color:var(--sub);font-weight:600;margin-top:8px}
.den{font-size:76px;font-weight:800;text-align:center;line-height:1.55;max-width:1680px}
.legend{display:flex;gap:28px;font-size:30px;font-weight:700}
.legend span{display:flex;align-items:center;gap:10px;color:var(--c)}
.legend span:before{content:'';width:26px;height:26px;border-radius:8px;background:var(--t);border:3px solid var(--c)}

/* outro */
.o-kick{font-size:52px;font-weight:800;color:var(--sub)}
.o-form{display:flex;align-items:center;gap:20px;flex-wrap:wrap;justify-content:center}
.o-form .ck{font-size:66px;padding:6px 26px 12px}
.o-form .plus{font-size:56px}
.o-small{font-size:42px;font-weight:700;color:var(--sub);text-align:center;line-height:1.5}
.o-small .ck{font-size:40px}
</style>
</head>
<body>
<div id="stage">
  <div id="slides"></div>
  <div id="bar"><i></i></div>
  <div id="cnt"></div>
  <div id="hint">클릭 · 스페이스 = 다음 ▶ &nbsp;|&nbsp; ← 이전</div>
</div>
<script>
/* ---------- helpers ---------- */
const R={s:'주어',v:'지각동사',o:'목적어',b:'동사원형',ing:'-ing',pp:'p.p.',x:''};
const fx=(from,to,extra='')=>`class="fx ${extra}"${from!=null?` data-from="${from}"`:''}${to!=null?` data-to="${to}"`:''}`;
const ck=(t,r)=>`<span class="ck r-${r}">${t}</span>`;
const hd=sec=>`<div class="hd"><div class="sec">${sec}</div><div class="logo"><b>영핏영어</b><span>YOUNG FIT</span></div></div>`;
const sent=arr=>arr.map(([t,r])=>r?ck(t,r):t).join(' ');

/* ---------- slide data ---------- */
const S=[
{type:'title'},

{type:'concept',sec:'① 지각동사가 뭐야?'},

{type:'merge',sec:'① 왜 필요할까?'},

{type:'skeleton',sec:'② 문장 뼈대'},

{type:'build',sec:'③ 조립 시연 1',note:'😡',
 kr:[['나는',0],['동생이',2],['내 치킨을',4],['먹는 걸',3],['봤다.',1]],
 ch:[['I','s','주어','먼저 <b>누가?</b> → 나는 = <em>I</em>'],
     ['saw','v','지각동사','<b>뭘 했어?</b> → 봤다 = <em>saw</em> &nbsp;👀 눈으로 봤으니까 지각동사!'],
     ['my brother','o','목적어','<b>누구를 봤어?</b> → 동생 = <em>my brother</em>'],
     ['eat','b','동사원형','<b>동생이 뭐 하는 걸?</b> → 먹는 걸 = <em>eat</em> &nbsp;(<span class="no">to</span> 없이 원형!)'],
     ['my chicken','x','무엇을','<b>뭘 먹었어?</b> → 내 치킨 = <em>my chicken</em>']],
 fin:'영어 순서 = <b>누가 → 봤다 → 누구를 → 뭐 하는 걸</b>'},

{type:'build',sec:'③ 조립 시연 2',note:'(게임 중에… 😱)',
 kr:[['나는',0],['엄마가',2],['내 이름을',4],['부르는 걸',3],['들었다.',1]],
 ch:[['I','s','주어','<b>누가?</b> → 나는 = <em>I</em>'],
     ['heard','v','지각동사','<b>뭘 했어?</b> → 들었다 = <em>heard</em> &nbsp;👂 귀로 들었으니까 지각동사!'],
     ['Mom','o','목적어','<b>누구 소리를?</b> → 엄마 = <em>Mom</em>'],
     ['call','b','동사원형','<b>엄마가 뭐 하는 걸?</b> → 부르는 걸 = <em>call</em> &nbsp;(<span class="no">to</span> ❌)'],
     ['my name','x','무엇을','<b>뭘 불러?</b> → 내 이름 = <em>my name</em>']],
 fin:'봤다 → <b>들었다</b>로 바뀌었을 뿐, <b>틀은 똑같지?</b>'},

{type:'build',sec:'③ 조립 시연 3',note:'(수업 시간에… 📳)',
 kr:[['나는',0],['폰이',2],['주머니에서',4],['진동하는 걸',3],['느꼈다.',1]],
 ch:[['I','s','주어','<b>누가?</b> → 나는 = <em>I</em>'],
     ['felt','v','지각동사','<b>뭘 했어?</b> → 느꼈다 = <em>felt</em> &nbsp;✋ 몸으로 느꼈으니까 지각동사!'],
     ['my phone','o','목적어','<b>뭐가?</b> → 내 폰 = <em>my phone</em>'],
     ['vibrate','b','동사원형','<b>폰이 뭐 하는 걸?</b> → 진동하는 걸 = <em>vibrate</em> &nbsp;(역시 <span class="no">to</span> ❌)'],
     ['in my pocket','x','어디서','<b>어디서?</b> → 주머니에서 = <em>in my pocket</em>']],
 fin:'saw · heard · felt — <b>지각동사 + 목적어 + 동사원형</b> 완성!'},

{type:'blank',sec:'④ 빈칸 도전 1',kr:'나는 친구가 게임에서 이기는 걸 봤다. 🎮',
 pre:'I watched my friend',post:'the game.',opts:['to win','win','won'],ans:1,
 why:'<b>watch</b>(지각동사) + my friend + <em>win</em> &nbsp;→ <span class="no">to win</span> ❌'},

{type:'blank',sec:'④ 빈칸 도전 2',kr:'나는 선생님이 한숨 쉬는 걸 들었다. 📝 (채점하시다가…)',
 pre:'I heard the teacher',post:'.',opts:['sighs','to sigh','sigh'],ans:2,
 why:'<b>hear</b> + the teacher + <em>sigh</em> &nbsp;→ 원형이니까 <span class="no">-s</span>도 안 붙여!'},

{type:'trap',sec:'⚠ 제일 많이 하는 실수'},

{type:'compare',sec:'⑤ 한 단계 더 : -ing도 OK!'},

{type:'build',sec:'⑤ -ing 조립 시연 1',note:'(챌린지 연습 중 🕺)',
 kr:[['나는',0],['친구가',2],['복도에서',4],['춤추고 있는 걸',3],['봤다.',1]],
 ch:[['I','s','주어','<b>누가?</b> → 나는 = <em>I</em>'],
     ['saw','v','지각동사','<b>뭘 했어?</b> → 봤다 = <em>saw</em>'],
     ['my friend','o','목적어','<b>누구를?</b> → 친구 = <em>my friend</em>'],
     ['dancing','ing','-ing','<b>춤추고 <u>있는</u> 걸</b> → 하고 있는 중이니까 <em>dancing</em>'],
     ['in the hallway','x','어디서','<b>어디서?</b> → 복도에서 = <em>in the hallway</em>']],
 fin:'자리는 똑같고, 원형 대신 <b>-ing</b>만 넣었어!'},

{type:'build',sec:'⑤ -ing 조립 시연 2',note:'(단톡방 폭주 💬)',
 kr:[['나는',0],['폰이',2],['밤새',4],['계속 울리고 있는 걸',3],['들었다.',1]],
 ch:[['I','s','주어','<b>누가?</b> → 나는 = <em>I</em>'],
     ['heard','v','지각동사','<b>뭘 했어?</b> → 들었다 = <em>heard</em>'],
     ['my phone','o','목적어','<b>뭐 소리를?</b> → 내 폰 = <em>my phone</em>'],
     ['buzzing','ing','-ing','<b>계속 울리고 <u>있는</u> 걸</b> → <em>buzzing</em>'],
     ['all night','x','언제','<b>언제?</b> → 밤새 = <em>all night</em>']],
 fin:'<b>지각동사 + 목적어 + -ing</b> = "~하고 있는 걸" 봤다/들었다'},

{type:'pair',sec:'⑥ 보너스 : p.p.는 언제?'},

{type:'build',sec:'⑥ p.p. 조립 시연',note:'(교무실로 오세요… 😨)',
 kr:[['나는',0],['내 이름이',2],['방송에서',4],['불리는 걸',3],['들었다.',1]],
 ch:[['I','s','주어','<b>누가?</b> → 나는 = <em>I</em>'],
     ['heard','v','지각동사','<b>뭘 했어?</b> → 들었다 = <em>heard</em>'],
     ['my name','o','목적어','<b>뭐가?</b> → 내 이름 = <em>my name</em>'],
     ['called','pp','p.p.','이름은 스스로 못 부르지! <b>불리는</b> 거니까 → <em>called</em>'],
     ['on the speaker','x','어디서','<b>어디서?</b> → 방송에서 = <em>on the speaker</em>']],
 fin:'목적어가 <b>당하는</b> 거면 → <b>p.p.</b>'},

{type:'blank',sec:'⑥ 빈칸 도전 3',kr:'나는 내 마지막 치킨이 동생한테 먹히는 걸 봤다. 😭',
 pre:'I saw my last chicken',post:'by my brother.',opts:['eat','eating','eaten'],ans:2,
 why:'치킨은 스스로 못 먹지! <b>먹히는</b> 거니까 → <em>eaten</em> (p.p.)'},

{type:'drill',sec:'⑦ 연속 드릴 — 입으로 따라 해봐! 🗣',items:[
 ['나는 배달 기사님이 벨 누르는 걸 들었다.','🛵',[['I','s'],['heard','v'],['the delivery driver','o'],['ring','b'],['the doorbell.','']]],
 ['우리는 아이돌이 무대에서 춤추는 걸 봤다.','🎤',[['We','s'],['watched','v'],['the idols','o'],['dance','b'],['on stage.','']]],
 ['나는 누가 내 의자를 발로 차는 걸 느꼈다.','😤',[['I','s'],['felt','v'],['someone','o'],['kick','b'],['my chair.','']]],
 ['나는 친구가 급식 줄에서 새치기하는 걸 봤다.','🍱',[['I','s'],['saw','v'],['my friend','o'],['cut','b'],['in the lunch line.','']]],
 ['엄마는 내가 몰래 게임하고 있는 걸 알아채셨다.','🙊',[['Mom','s'],['noticed','v'],['me','o'],['playing','ing'],['games secretly.','']]],
 ['나는 유튜버가 라면 10봉지 먹는 걸 봤다.','🍜',[['I','s'],['watched','v'],['a YouTuber','o'],['eat','b'],['10 packs of ramen.','']]],
 ['나는 뭔가 타고 있는 냄새를 맡았다.','🔥',[['I','s'],['smelled','v'],['something','o'],['burning.','ing']]],
 ['나는 내 수학 점수가 발표되는 걸 들었다.','😱',[['I','s'],['heard','v'],['my math score','o'],['announced.','pp']]]
]},

{type:'outro',sec:'⑧ 오늘의 한 줄'}
];

/* ---------- renderers ---------- */
function rTitle(){return `${hd('영핏영어 문법 영상')}
 <div class="t-kick">보고 · 듣고 · 느낀 걸 말하는 법</div>
 <div class="t-main">지각동사</div>
 <div class="t-emo">👀👂✋</div>
 <div class="t-sub">see · hear · feel + <span style="color:#B45309">누가</span> + <span style="color:#6D28D9">뭐 하는 걸</span></div>`}

function rConcept(d){
 const cards=[['👀','see<br>watch','보다'],['👂','hear<br>listen to','듣다'],['✋','feel','느끼다'],['💡','notice','알아채다'],['👃','smell','냄새 맡다']];
 return `${hd(d.sec)}
 <div class="headline">지각동사 = <b>보고 · 듣고 · 느끼는</b> 동사</div>
 <div class="cards">${cards.map((c,i)=>`<div ${fx(i+1,null,'card')}><div class="e">${c[0]}</div><div class="en">${c[1]}</div><div class="ko">${c[2]}</div></div>`).join('')}</div>
 <div ${fx(6,null,'subline')}>👉 "<b>누가 뭐 하는 걸</b>" 봤다 / 들었다 / 느꼈다 말할 때 써!</div>`}

function rMerge(d){
 return `${hd(d.sec)}
 <div class="mgrid">
  <div ${fx(1,null,'mcard')}><div class="k">나는 동생을 봤다.</div><div class="e">I saw <span class="hl r-o" data-lit="4">my brother</span>.</div></div>
  <div ${fx(2,null,'mcard')}><div class="k">동생이 내 치킨을 먹었다.</div><div class="e"><span class="hl r-o" data-lit="4">My brother</span> <span class="hl r-b" data-lit="4">ate</span> my chicken.</div></div>
 </div>
 <div ${fx(3,null,'arrow')}>⬇ 두 문장을 하나로 합체!</div>
 <div ${fx(3,null,'result')}>
  <div class="k">나는 동생이 내 치킨을 먹는 걸 봤다. 😡</div>
  <div class="e">${sent([['I','s'],['saw','v'],['my brother','o'],['eat','b'],['my chicken.','']])}</div>
 </div>
 <div class="stack"><div ${fx(4,null,'tip')}>겹치는 <b>my brother</b>는 한 번만! &nbsp;<b>ate</b> → <em>eat</em> (동사원형)</div></div>`}

function rSkeleton(d){
 const box=(n,h,r,i)=>`<div ${fx(i,null,`fbox r-${r}`)}><div class="n">${n}</div><div class="h">${h}</div>${r==='b'?`<div ${fx(5,null,'stamp')}>to ❌</div>`:''}</div>`;
 const ex=(t,r,i)=>`<div ${fx(6,null,`chunk fex r-${r}`)}><div class="w">${t}</div></div>`;
 return `${hd(d.sec)}
 <div class="prompt">지각동사 문장은 딱 이 모양!</div>
 <div class="fgrid">
  ${box('주어','누가','s',1)}<div ${fx(2,null,'plus')}>+</div>
  ${box('지각동사','봤다·들었다·느꼈다','v',2)}<div ${fx(3,null,'plus')}>+</div>
  ${box('목적어','누가 / 무엇이','o',3)}<div ${fx(4,null,'plus')}>+</div>
  ${box('동사원형','뭐 하는 걸','b',4)}
  ${ex('I','s')}<div></div>${ex('saw','v')}<div></div>${ex('my brother','o')}<div></div>${ex('eat','b')}
 </div>
 <div class="stack">
  <div ${fx(5,5,'tip')}>동사원형 앞에 <span class="no">to</span>를 붙이면 안 돼!</div>
  <div ${fx(6,6,'tip')}>(my chicken 같은 나머지는 뒤에 붙이면 끝)</div>
  <div ${fx(7,null,'tip')}>목적어 자리엔 <em>me · him · her · them · us</em> &nbsp;( <span class="no">I, he, she</span> ❌ )</div>
 </div>`}

function rBuild(d){
 const n=d.ch.length;
 const kr=d.kr.map(([t,ref])=>`<span class="kp r-${d.ch[ref][1]}" data-lit="${ref+1}">${t}</span>`).join(' ');
 const chunks=d.ch.map((c,i)=>`<div ${fx(i+1,null,`chunk r-${c[1]}`)} data-cur="${i+1}"><div class="lab">${c[2]}</div><div class="w">${c[0]}</div></div>`).join('')+`<div ${fx(n+1,null,'dot')}>.</div>`;
 const tips=d.ch.map((c,i)=>`<div ${fx(i+1,i+1,'tip')}>${c[3]}</div>`).join('')+`<div ${fx(0,0,'prompt')}>한글 뜻 먼저 보고, 영어로 하나씩 조립해 보자 👇</div><div ${fx(n+1,null,'tip final')}>✔ ${d.fin}</div>`;
 return `${hd(d.sec)}
 <div class="kr">${kr}<span class="note">${d.note||''}</span></div>
 <div class="chunks">${chunks}</div>
 <div class="stack" style="min-height:120px">${tips}</div>`}

function rBlank(d){
 const opts=d.opts.map((o,i)=>`<div class="opt delay ${i===d.ans?'good':'bad'}" data-lit="2"><i>${'①②③④'[i]}</i>${o}</div>`).join('');
 return `${hd(d.sec)}
 <div class="kr">${d.kr}</div>
 <div class="bsent"><span>${d.pre}</span><span class="blank"><span ${fx(null,1,'q delay-out')}>?</span><span ${fx(2,null,'a delay')}>${d.opts[d.ans]}</span></span><span>${d.post}</span></div>
 <div ${fx(1,null,'opts')}>${opts}</div>
 <div class="stack" style="min-height:110px">
  <div ${fx(0,0,'prompt')}>빈칸에 뭐가 들어갈까? 🤔</div>
  <div ${fx(2,2,'think')}>🤔 생각해 봐! <div class="track"><div class="fill"></div></div></div>
  <div ${fx(3,null,'tip final')}>${d.why}</div>
 </div>`}

function rTrap(d){
 return `${hd(d.sec)}
 <div class="trows">
  <div class="trow">
   <div ${fx(1,null,'tc bad')}>❌ I saw him <span class="x">to</span> dance.</div>
   <div ${fx(2,null,'tarrow')}>➜</div>
   <div ${fx(2,null,'tc good')}>✅ I saw him <span class="ok">dance</span>.</div>
   <div ${fx(2,null,'twhy')}>지각동사 뒤에는 <b>to</b>가 절대 안 와!</div>
  </div>
  <div class="trow">
   <div ${fx(3,null,'tc bad')}>❌ I heard <span class="x">she</span> sing.</div>
   <div ${fx(4,null,'tarrow')}>➜</div>
   <div ${fx(4,null,'tc good')}>✅ I heard <span class="ok">her</span> sing.</div>
   <div ${fx(4,null,'twhy')}>목적어 자리니까 <b>she</b> → her (목적격)</div>
  </div>
 </div>
 <div ${fx(5,null,'memo')}>지각동사는 맨날 <b>지각</b>해서 <b>to</b>를 놓친다! 🏃💨<span class="small">→ 그래서 to 없이 바로 동사원형</span></div>`}

function rCompare(d){
 return `${hd(d.sec)}
 <div class="prompt">원형 자리에 <b style="color:#BE185D">-ing</b>를 넣어도 돼. 느낌만 살짝 달라!</div>
 <div class="cmp">
  <div ${fx(1,null,'cc r-b')}>
   <div class="s">I saw him ${ck('cross','b')} the road.</div>
   <div class="tag">원형 = 🎬 풀영상</div>
   <div class="track2" data-lit="2"><div class="line"><div class="fill"></div></div><div class="walker">🚶</div><div class="lb" style="left:0">시작</div><div class="lb" style="right:0">끝</div></div>
   <div class="d">건너는 걸 <b>처음부터 끝까지</b> 다 봤다</div>
  </div>
  <div ${fx(3,null,'cc r-ing')}>
   <div class="s">I saw him ${ck('crossing','ing')} the road.</div>
   <div class="tag">-ing = 📸 순간 캡처</div>
   <div class="track2" data-lit="4"><div class="line"><div class="fill" style="width:50%;transition:none"></div></div><div class="frame"></div><div class="walker mid">🚶</div><div class="lb" style="left:0">시작</div><div class="lb" style="right:0">끝</div></div>
   <div class="d">건너고 <b>있는 중간</b> 순간을 봤다</div>
  </div>
 </div>
 <div ${fx(5,null,'cnote')}>둘 다 문법적으로 <b>정답!</b> &nbsp;핵심은 → <b>to만 안 붙이면 OK</b></div>`}

function rPair(d){
 return `${hd(d.sec)}
 <div class="prows">
  <div class="prow">
   <div ${fx(1,null,'k')}>엄마가 내 이름을 <u>부르는</u> 걸 들었다.</div>
   <div ${fx(2,null,'e')}>I heard ${ck('Mom','o')} ${ck('call','b')} my name.</div>
   <div ${fx(2,null,'why r-b')}>엄마가 <b>직접</b> 부름 → <b>원형</b></div>
  </div>
  <div class="prow">
   <div ${fx(3,null,'k')}>내 이름이 <u>불리는</u> 걸 들었다.</div>
   <div ${fx(4,null,'e')}>I heard ${ck('my name','o')} ${ck('called','pp')}.</div>
   <div ${fx(4,null,'why r-pp')}>이름은 <b>불리는(당하는)</b> 거 → <b>p.p.</b></div>
  </div>
 </div>
 <div ${fx(5,null,'rule')}>
  <div>목적어가 <b>직접 하면</b></div><div>→ ${ck('동사원형','b')} ${ck('-ing','ing')}</div>
  <div>목적어가 <b>당하면</b></div><div>→ ${ck('p.p.','pp')}</div>
 </div>`}

function rDrill(d){
 const N=d.items.length;
 const items=d.items.map((it,i)=>{const a=2*i+1,b=2*i+2,last=(i===N-1)?null:b;
  return `<div ${fx(a,last,'ditem')}>
   <div class="dnum">${i+1} / ${N}</div>
   <div class="dkr">${it[0]} ${it[1]}</div>
   <div ${fx(b,null,'den')}>${sent(it[2])}</div>
  </div>`}).join('');
 return `${hd(d.sec)}
 <div class="stack dwrap">
  <div ${fx(0,0,'ditem')}><div class="dkr">한글을 보면 <b style="color:#1B2970">먼저 입으로</b> 영작해 보고,<span class="note">클릭하면 정답이 나와!</span></div></div>
  ${items}
 </div>
 <div class="legend"><span class="r-s">주어</span><span class="r-v">지각동사</span><span class="r-o">목적어</span><span class="r-b">동사원형</span><span class="r-ing">-ing</span><span class="r-pp">p.p.</span></div>`}

function rOutro(d){
 return `${hd(d.sec)}
 <div class="o-kick">오늘은 이거 하나만 기억해!</div>
 <div ${fx(1,null,'o-form')}>${ck('see · hear · feel','v')}<span class="plus">+</span>${ck('누가','o')}<span class="plus">+</span>${ck('to 없이 동사원형','b')}</div>
 <div ${fx(2,null,'memo')}>지각동사는 <b>지각</b>해서 <b>to</b>를 놓친다! 🏃💨</div>
 <div ${fx(3,null,'o-small')}>하고 있는 중이면 ${ck('-ing','ing')} &nbsp;·&nbsp; 당하는 거면 ${ck('p.p.','pp')}</div>`}

const RENDER={title:rTitle,concept:rConcept,merge:rMerge,skeleton:rSkeleton,build:rBuild,blank:rBlank,trap:rTrap,compare:rCompare,pair:rPair,drill:rDrill,outro:rOutro};

/* ---------- engine ---------- */
const wrap=document.getElementById('slides');
wrap.innerHTML=S.map(d=>`<section class="slide t-${d.type}">${RENDER[d.type](d)}</section>`).join('');
const slides=[...wrap.children];
const maxes=slides.map(s=>{let m=0;s.querySelectorAll('[data-from],[data-to],[data-lit],[data-cur]').forEach(e=>{['from','to','lit','cur'].forEach(k=>{if(e.dataset[k]!=null)m=Math.max(m,+e.dataset[k])})});return m});
let si=0,st=0;
const h=parseInt((location.hash||'').slice(1));if(h>0&&h<=slides.length)si=h-1;

function apply(){
 slides.forEach((s,i)=>s.classList.toggle('active',i===si));
 const s=slides[si];
 s.querySelectorAll('[data-from],[data-to]').forEach(e=>{const f=e.dataset.from!=null?+e.dataset.from:-1,t=e.dataset.to!=null?+e.dataset.to:1e9;e.classList.toggle('on',st>=f&&st<=t)});
 s.querySelectorAll('[data-lit]').forEach(e=>e.classList.toggle('lit',st>=+e.dataset.lit));
 s.querySelectorAll('[data-cur]').forEach(e=>e.classList.toggle('cur',st===+e.dataset.cur));
 const total=maxes.reduce((a,b)=>a+b+1,0),done=maxes.slice(0,si).reduce((a,b)=>a+b+1,0)+st+1;
 document.querySelector('#bar i').style.width=(done/total*100)+'%';
 document.getElementById('cnt').textContent=`${si+1} / ${slides.length}`;
 history.replaceState(null,'','#'+(si+1));
}
function next(){if(st<maxes[si])st++;else if(si<slides.length-1){si++;st=0}apply()}
function prev(){if(st>0)st--;else if(si>0){si--;st=maxes[si]}apply()}
document.addEventListener('click',e=>{if(e.target.closest('a,button'))return;next()});
document.addEventListener('contextmenu',e=>{e.preventDefault();prev()});
document.addEventListener('keydown',e=>{
 if([' ','ArrowRight','Enter','PageDown','ArrowDown'].includes(e.key)){e.preventDefault();next()}
 else if(['ArrowLeft','PageUp','ArrowUp','Backspace'].includes(e.key)){e.preventDefault();prev()}
 else if(e.key==='Home'){si=0;st=0;apply()}
 else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
});
function fit(){const g=document.getElementById('stage');const k=Math.min(innerWidth/1920,innerHeight/1080);g.style.transform=`translate(-50%,-50%) scale(${k})`;g.style.transformOrigin='center center'}
addEventListener('resize',fit);fit();
setTimeout(()=>document.getElementById('hint').classList.add('hide'),5000);
let idle;addEventListener('mousemove',()=>{document.body.classList.remove('nocursor');clearTimeout(idle);idle=setTimeout(()=>document.body.classList.add('nocursor'),2000)});
function fitChunks(){document.querySelectorAll('.chunks').forEach(c=>{c.style.removeProperty('--cw');const kids=[...c.children];const w=kids.reduce((a,e)=>a+e.getBoundingClientRect().width/ (document.getElementById('stage').getBoundingClientRect().width/1920),0)+24*(kids.length-1);if(w>1600){c.style.setProperty('--cw',Math.max(54,Math.floor(76*1600/w))+'px')}})}
fitChunks();if(document.fonts)document.fonts.ready.then(fitChunks);
apply();
</script>
